  name: Export Android Secrets Encrypted

  on:
    workflow_dispatch:
      inputs:
        export_passphrase:
          description: "Temporary passphrase used only to encrypt the artifact"
          required: true
          type: string

  permissions:
    contents: read
    actions: read

  jobs:
    export:
      name: Export encrypted Android secrets
      runs-on: ubuntu-latest

      steps:
        - name: Create encrypted Android secrets package
          shell: bash
          env:
            EXPORT_PASSPHRASE: ${{ inputs.export_passphrase }}

            ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
            ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

          run: |
            set -euo pipefail

            mkdir -p export

            for secret in \
              "$EXPORT_PASSPHRASE" \
              "$ANDROID_KEYSTORE_BASE64" \
              "$ANDROID_KEYSTORE_PASSWORD"
            do
              if [ -n "$secret" ]; then
                echo "::add-mask::$secret"
              fi
            done

            cat > export/secrets.env <<EOF
            ANDROID_KEYSTORE_BASE64=${ANDROID_KEYSTORE_BASE64}
            ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}
            EOF

            chmod 600 export/secrets.env

            tar -czf exported-android-secrets.tar.gz export

            gpg --batch --yes \
              --passphrase "$EXPORT_PASSPHRASE" \
              --symmetric \
              --cipher-algo AES256 \
              --output exported-android-secrets.tar.gz.gpg \
              exported-android-secrets.tar.gz

            rm -rf export exported-android-secrets.tar.gz

        - name: Upload encrypted artifact
          uses: actions/upload-artifact@v4
          with:
            name: exported-android-secrets-encrypted
            path: exported-android-secrets.tar.gz.gpg
            retention-days: 1
